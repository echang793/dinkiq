<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060c1a">
<title>DinkIQ — can't reach the server</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060c1a;color:#e8eefc;font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px}
  main{max-width:420px;text-align:center}
  h1{font-size:24px;margin:0 0 10px}
  p{color:#9fb0cf;margin:0 0 22px}
  button{font:inherit;font-weight:700;background:#f5c542;color:#0a1428;border:0;border-radius:8px;padding:14px 26px;min-height:48px;cursor:pointer}
  .bug{display:inline-block;background:#f5c542;color:#0a1428;font-weight:900;padding:8px 11px;border-radius:5px;transform:skewX(-8deg);margin-bottom:18px}
</style>
</head>
<body>
<main>
  <div class="bug">DI</div>
  <h1>Can't reach DinkIQ</h1>
  <p>The app can't connect to your server right now. Your sessions and data are safe on it; nothing here is lost. Check your connection (or that the Mac mini is awake), then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
