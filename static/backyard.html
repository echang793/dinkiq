  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

}[data-ap=\"8\"]{animation-delay:.52s;}[data-ap=\"9\"]{animation-delay:.59s;}\n[data-sheen]::before{content:'';position:absolute;top:0;bottom:0;width:46px;background:linear-gradient(105deg,transparent,rgba(180,230,255,0.07),transparent);animation:sheen 9s ease-in-out infinite;pointer-events:none;z-index:2;}\n[data-blink]{animation:blink 2s infinite;}\n[data-marquee]{animation:marquee 45s linear infinite;}\n[data-flicker]{animation:flicker 7s infinite;}\n[data-boot-line=\"1\"]{animation:bootLine .3s ease .2s both;}\n[data-boot-line=\"2\"]{animation:bootLine .3s ease .7s both;}\n[data-boot-line=\"3\"]{animation:bootLine .3s ease 1.2s both;}\n[data-boot-line=\"4\"]{animation:bootLine .3s ease 1.7s both;}\n[data-boot-line=\"5\"]{animation:bootLine .3s ease 2.2s both;}\n[data-boot-line=\"6\"]{animation:bootLine .3s ease 2.6s both;}\n[data-boot-wrap]{animation:bootOut .6s ease 3.1s both;}\ninput[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(120,180,230,0.25);outline:none;}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc,#35e0ff);cursor:pointer;box-shadow:0 0 6px var(--acc,#35e0ff);}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100vw; height:100vh; position:relative; display:flex; flex-direction:column; background:radial-gradient(ellipse 80% 60% at 50% 40%, #081221 0%, #04070d 70%); font-family:'JetBrains Mono',monospace; color:#c8dcf0; overflow:hidden;\" data-screen-label=\"Tracking Station\">\n\n  <x-import component-from-global-scope=\"star-field\" from=\"9f48a2a3-6a82-4205-aef3-1b0e9d01d7b0#/fx.js\" hint-size=\"100%,100%\" style=\"position:absolute; inset:0; z-index:0; pointer-events:none;\"><\u002Fx-import>\n\n  <div style=\"position:relative; z-index:1; flex:1; min-height:0; display:grid; grid-template-columns:300px 1fr 330px; gap:14px; padding:14px 14px 8px;\">\n\n  <!-- LEFT COLUMN -->\n  <div style=\"display:flex; flex-direction:column; gap:var(--gap,12px); min-height:0; overflow-y:auto; scrollbar-gutter:stable; padding-right:2px;\">\n\n    <!-- ground station / editable coords -->\n<div data-panel-col=\"left\" data-panel-idx=\"0\" sc-camel-on-pointer-down=\"{{ leftHandlers.0.down }}\" style=\"cursor:grab; position:relative; flex-shrink:0; overflow:hidden; background:rgba(255,255,255,0.035); backdrop-filter:blur(14px); border:1px solid rgba(120,180,230,0.14); border-radius:10px; padding:var(--pad,14px) 16px; order:{{ leftPos.0 }}; opacity:{{ leftOpacity.0 }};\" data-ap=\"1\" data-sheen=\"1\" data-comment-anchor=\"coords-panel\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;\">\n        <div style=\"display:flex; align-items:center; gap:8px;\">\n          <div style=\"width:7px; height:7px; border-radius:50%; background:var(--acc,#4dffb8); box-shadow:0 0 8px var(--acc,#4dffb8);\" data-blink=\"1\"><\u002Fdiv>\n          <div style=\"font-size:10px; letter-spacing:2.5px; color:var(--acc,#4dffb8);\">GROUND STATION<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleEdit }}\" style=\"background:none; border:1px solid rgba(120,180,230,0.25); border-radius:5px; color:#8fb2d4; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; padding:3px 8px; cursor:pointer;\" style-hover=\"border:1px solid var(--acc,#4dffb8); color:var(--acc,#4dffb8);\">{{ editBtnLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"display:flex; align-items:center; gap:8px;\">\n            <span style=\"font-size:9px; color:#5d7a96; width:28px;\">LAT<\u002Fspan>\n            <input value=\"{{ editLat }}\" sc-camel-on-input=\"{{ onLatInput }}\" style=\"flex:1; min-width:0; background:rgba(0,0,0,0.35); border:1px solid rgba(120,180,230,0.3); border-ra uot;: [&quot;comfortable&quot;, &quot;compact&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Console&quot;}, &quot;soundBlips&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Console&quot;}}\">\nclass Component extends DCLogic {\n  state = { tick: 0, editing: false, editLat: '', editLon: '', coordError: false, scrubVal: 0, boot: true, ...this.loadPanelOrder(), dragCol: null, dragFrom: null, exportLabel: 'COPY PLAN', savedLocs: this.loadSavedLocs(), collapsed: this.loadCollapsed() };\n\n  loadPanelOrder() {\n    let left = [0, 1, 2, 3, 4, 5], right = [0, 1, 2, 3, 4, 5, 6, 7];\n    try {\n      const saved = JSON.parse(localStorage.getItem('stationPanelOrder') || 'null');\n      if (saved && Array.isArray(saved.left) && saved.left.length === left.length) left = saved.left;\n      if (saved && Array.isArray(saved.right) && saved.right.length === right.length) right = saved.right;\n    } catch (e) { }\n    return { leftOrder: left, rightOrder: right };\n  }\n  savePanelOrder(leftOrder, rightOrder) {\n    try { localStorage.setItem('stationPanelOrder', JSON.stringify({ left: leftOrder, right: rightOrder })); } catch (e) { }\n  }\n  loadSavedLocs() { try { return JSON.parse(localStorage.getItem('station-saved-locs-v1') || '[]'); } catch (e) { return []; } }\n  persistSavedLocs(list) { try { localStorage.setItem('station-saved-locs-v1', JSON.stringify(list)); } catch (e) { } }\n  saveCurrentLoc(lat, lon) {\n    const label = prompt('Name this location:', 'Location ' + (this.state.savedLocs.length + 1));\n    if (!label) return;\n    const list = this.state.savedLocs.concat([{ label, lat, lon }]).slice(-6);\n    this.persistSavedLocs(list);\n    this.setState({ savedLocs: list });\n  }\n  deleteSavedLoc(i) {\n    const list = this.state.savedLocs.slice(); list.splice(i, 1);\n    this.persistSavedLocs(list);\n    this.setState({ savedLocs: list });\n  }\n  loadCollapsed() { try { return Object.assign({ planets: false, showers: false }, JSON.parse(localStorage.getItem('station-collapsed-v1') || '{}')); } catch (e) { return { planets: false, showers: false }; } }\n  toggleCollapse(key) {\n    const c = { ...this.state.collapsed, [key]: !this.state.collapsed[key] };\n    try { localStorage.setItem('station-collapsed-v1', JSON.stringify(c)); } catch (e) { }\n    this.setState({ collapsed: c });\n  }\n  nudgeScrub(deltaMin) {\n    const S = window.STATION || {};\n    const v = Math.max(-720, Math.min(1440, this.state.scrubVal + deltaMin));\n    this.setState({ scrubVal: v });\n    S.setTimeOffset && S.setTimeOffset(v * 60000);\n  }\n  captureFlip(col, excludeIdx) {\n    const rects = {};\n    document.querySelectorAll(`[data-panel-col=\"${col}\"]`).forEach((el) => {\n      if (el.dataset.panelIdx === String(excludeIdx)) return;\n      rects[el.dataset.panelIdx] = el.getBoundingClientRect();\n    });\n    this._flip = this._flip || {};\n    this._flip[col] = rects;\n  }\n  playFlip(col) {\n    const oldRects = this._flip && this._flip[col];\n    if (!oldRects) return;\n    this._flip[col] = null;\n    document.querySelectorAll(`[data-panel-col=\"${col}\"]`).forEach((el) => {\n      const old = oldRects[el.dataset.panelIdx];\n      if (!old) return;\n      const now = el.getBoundingClientRect();\n      const dx = old.left - now.left, dy = old.top - now.top;\n      if (!dx && !dy) return;\n      el.style.transition = 'none';\n      el.style.transform = `translate(${dx}px, ${dy}px)`;\n      requestAnimationFrame(() => {\n        el.style.transition = 'transform 200ms cubic-bezier(0.22,0.8,0.28,1)';\n        el.style.transform = '';\n      });\n    });\n  }\n  panelHandlers(col) {\n    const orderKey = col === 'left' ? 'leftOrder' : 'rightOrder';\n    const n = this.state[orderKey].length;\n    const out = [];\n    for (let idx = 0; idx < n; idx++) {\n      out.push({\n        down: (e) => {\n          if (e.button !== undefined && e.button !== 0) return;\n          if (e.target.closest && e.target.closest('button, input, a, select, textarea')) return;\n          const el = e.currentTarget;\n          const startX = e.clientX, startY = e.clientY;\n          let started = false, lastHover = idx, targetX = 0, targetY = 0, curX = 0, curY = 0, raf = null, settling = false;\n          const THRESH = 5;\n          const tick = () => {\n            curX += (targetX - curX) * 0.18;\n            curY += (targetY - curY) * 0.18;\n            el.style.transform = `translate(${curX}px, ${curY}px) scale(1.02)`;\n            if (settling && Math.abs(targetX - curX) < 0.5 && Math.abs(targetY - curY) < 0.5) {\n              el.style.transform = '';\n              raf = null;\n              finish();\n              return;\n            }\n            raf = requestAnimationFrame(tick);\n          };\n          const onMove = (ev) => {\n            const dx = ev.clientX - startX, dy = ev.clientY - startY;\n            if (!started) {\n              if (Math.abs(dx) < THRESH && Math.abs(dy) < THRESH) return;\n              started = true;\n              document.body.style.userSelect = 'none';\n              el.style.transition = 'none';\n              el.style.zIndex = '30';\n              el.style.willChange = 'transform';\n              el.style.pointerEvents = 'none';\n              el.style.boxShadow = '0 18px 40px rgba(0,0,0,0.5)';\n              curX = dx; curY = dy;\n              this.setState({ dragCol: col, dragFrom: idx });\n              raf = requestAnimationFrame(tick);\n            }\n            targetX = dx; targetY = dy;\n            const under = document.elementFromPoint(ev.clientX, ev.clientY);\n            const panel = under && under.closest(`[data-panel-col=\"${col}\"]`);\n            if (panel && panel !== el) {\n              const hoverIdx = Number(panel.dataset.panelIdx);\n              if (hoverIdx !== lastHover) {\n                lastHover = hoverIdx;\n                const order = this.state[orderKey].slice();\n                const fromPos = order.indexOf(idx);\n                const toPos = order.indexOf(hoverIdx);\n                if (fromPos !== toPos) {\n                  this.captureFlip(col, idx);\n                  order.splice(toPos, 0, order.splice(fromPos, 1)[0]);\n                  this.setState({ [orderKey]: order }, () => this.playFlip(col));\n                }\n              }\n            }\n          };\n          const finish = () => {\n            document.body.style.userSelect = '';\n            el.style.transition = '';\n            el.style.boxShadow = '';\n            el.style.pointerEvents = '';\n            el.style.zIndex = '';\n            el.style.willChange = '';\n            this.savePanelOrder(this.state.leftOrder, this.state.rightOrder);\n            this.setState({ dragCol: null, dragFrom: null });\n          };\n          const onUp = () => {\n            document.removeEventListener('pointermove', onMove);\n            document.removeEventListener('pointerup', onUp);\n            if (!started) return;\n            targetX = 0; targetY = 0; settling = true;\n            if (!raf) raf = requestAnimationFrame(tick);\n          };\n          document.addEventListener('pointermove', onMove);\n          document.addEventListener('pointerup', onUp);\n        }\n      });\n    }\n    return out;\n  }\n  positionsFor(order) {\n    const pos = [];\n    order.forEach((origIdx, p) => { pos[origIdx] = p; });\n    return pos;\n  }\n\n  componentDidMount() {\n    this._on = () => {\n      const now = Date.now();\n      if (!this._last || now - this._last > 450) { this._last = now; this.setState({ tick: now }); }\n    };\n    window.addEventListener('station-tick', this._on);\n    window.addEventListener('station-layers', this._on);\n    window.addEventListener('station-home', this._on);\n    this._onKey = (e) => {\n      if (e.target && /input|textarea/i.test(e.target.tagName)) return;\n      const S = window.STATION || {};\n      if (e.code === 'Space') { e.preventDefault(); this.blip(700); S.focusHome && S.focusHome(); }\n      else if (e.code === 'ArrowLeft') { e.preventDefault(); this.nudgeScrub(-15); }\n      else if (e.code === 'ArrowRight') { e.preventDefault(); this.nudgeScrub(15); }\n      else if (e.code === 'Backspace' || e.code === 'Digit0') { this.blip(480); this.setState({ scrubVal: 0 }); S.setTimeOffset && S.setTimeOffset(0); }\n    };\n    window.addEventListener('keydown', this._onKey);\n    this.applyFx();\n    this._bootT = setTimeout(() => this.setState({ boot: false }), 3900);\n  }\n  componentDidUpdate() { this.applyFx(); }\n  componentWillUnmount() {\n    clearTimeout(this._bootT);\n    window.removeEventListener('station-tick', this._on);\n    window.removeEventListener('station-layers', this._on);\n    window.removeEventListener('station-home', this._on);\n    window.removeEventListener('keydown', this._onKey);\n  }\n\n  applyFx() {\n    const accents = { green: '#4dffb8', cyan: '#35e0ff', amber: '#ffb347', magenta: '#ff5fd0' };\n    const r = document.documentElement.style;\n    r.setProperty('--acc', accents[this.props.accent ?? 'green'] || '#4dffb8');\n    const compact = this.props.density === 'compact';\n    r.setProperty('--pad', compact ? '9px' : '14px');\n    r.setProperty('--gap', compact ? '8px' : '12px');\n    const fx = this.props.fxIntensity ?? 0.8;\n    window.__FX_INTENSITY = fx;\n    r.setProperty('--fxop', (0.42 * fx).toFixed(3));\n  }\n\n  blip(f) { if (this.props.soundBlips && window.FXBLIP) window.FXBLIP(f); }\n\n  renderVals() {\n    const S = window.STATION || {};\n    const T = S.telemetry || {};\n    const M = S.moon || {};\n    const P = M.phase || {};\n    const L = S.launch || {};\n    const SU = S.sun || {};\n    const I = S.iss || {};\n    const F = S.forecast || {};\n    const TW = S.twilight || {};\n    const Z = S.zenith || {};\n    const home = S.home || { lat: 32.975469, lon: -117.078316 };\n    const layers = S.lay 255,184,0.45)' : 'transparent',\n        select: () => { this.blip(760); S.select && S.select(o.name); }\n      };\n    });\n\n    // planets strip\n    const planetChips = (S.objects || []).filter((o) => o.type === 'planet').map((o) => ({\n      name: o.name.toUpperCase(), el: f0(o.alt),\n      select: () => { this.blip(760); S.select && S.select(o.name); }\n    }));\n\n    // point-me / target lock description\n    let selName = '', selDesc = '';\n    if (selected) {\n      const so = (S.objects || []).find((o) => o.name === selected);\n      if (so) {\n        selName = selected;\n        selDesc = `LOOK ${S.cardinal ? S.cardinal(so.az) : ''} (${Math.round(so.az)}°) — ${S.altWord ? S.altWord(so.alt) : ''} (${Math.round(so.alt)}° UP)`;\n      }\n    }\n\n    // scrub label\n    const off = this.state.scrubVal;\n    const sgn = off < 0 ? '-' : '+';\n    const ao = Math.abs(off);\n    const scrubLabel = off === 0 ? 'LIVE' : `${sgn}${Math.floor(ao / 60)}H ${String(ao % 60).padStart(2, '0')}M`;\n\n    // meteor shower calendar\n    const showers = (S.showers || []).slice().sort((a, b) => Math.abs(a.daysToPeak) - Math.abs(b.daysToPeak));\n    const showerRows = showers.slice(0, 4).map((s, i) => ({\n      name: s.n.toUpperCase(), peak: s.peakStr, zhr: s.zhr,\n      when: s.daysToPeak === 0 ? 'TONIGHT' : s.daysToPeak > 0 ? `IN ${s.daysToPeak}D` : `${-s.daysToPeak}D AGO`,\n      whenColor: s.daysToPeak === 0 ? '#4dffb8' : Math.abs(s.daysToPeak) <= 3 ? '#ffd76a' : '#5d7a96',\n      bg: i === 0 ? 'rgba(201,147,255,0.07)' : 'rgba(255,255,255,0.02)'\n    }));\n    const best = showers[0];\n\n    // ISS pass predictions\n    const passes = (S.issPassList || []).filter((p) => p.inMin > -5).slice(0, 3);\n    const passRows = passes.map((p, i) => ({\n      at: p.at, maxEl: p.maxEl, dir: p.dir,\n      vis: p.dark ? 'VISIBLE' : 'DAYLIGHT',\n      visColor: p.dark ? '#4dffb8' : '#8fb2d4',\n      countdown: p.inMin <= 0 ? 'NOW' : p.inMin < 60 ? `T-${p.inMin}M` : `T-${Math.floor(p.inMin / 60)}H${String(p.inMin % 60).padStart(2, '0')}`,\n      cdColor: p.inMin <= 20 ? '#4dffb8' : '#8fb2d4',\n      primeTag: p.bright ? '★ ' : '',\n      bg: i === 0 ? 'rgba(154,216,255,0.07)' : 'rgba(255,255,255,0.02)'\n    }));\n\n    // aurora / Kp\n    const wx = window.SPACEWX || { kp: 0, mode: 'EST' };\n    const kp = wx.kp;\n    const kpWord = kp < 3 ? 'QUIET' : kp < 5 ? 'UNSETTLED' : kp < 7 ? 'STORM G1-G2' : 'SEVERE STORM';\n    const kpColor = kp < 3 ? '#4dffb8' : kp < 5 ? '#ffd76a' : '#ff8a8a';\n    const kpNote = kp >= 7 ? 'AURORA POSSIBLE AT MID-LATITUDES — LOOK NORTH'\n      : kp >= 5 ? 'AURORA LIKELY AT HIGH LATITUDES'\n        : 'NO AURORA EXPECTED AT YOUR LATITUDE';\n\n    // deep-sky object of the night\n    const DSOS = [\n      { id: 'M31', nm: 'ANDROMEDA GALAXY', kind: 'SPIRAL GALAXY', con: 'ANDROMEDA', ra: 10.68, dec: 41.27, mag: 3.4 },\n      { id: 'M42', nm: 'ORION NEBULA', kind: 'EMISSION NEBULA', con: 'ORION', ra: 83.82, dec: -5.39, mag: 4.0 },\n      { id: 'M45', nm: 'PLEIADES', kind: 'OPEN CLUSTER', con: 'TAURUS', ra: 56.75, dec: 24.12, mag: 1.6 },\n      { id: 'M13', nm: 'HERCULES CLUSTER', kind: 'GLOBULAR CLUSTER', con: 'HERCULES', ra: 250.42, dec: 36.46, mag: 5.8 },\n      { id: 'M51', nm: 'WHIRLPOOL GALAXY', kind: 'SPIRAL GALAXY', con: 'CANES VENATICI', ra: 202.47, dec: 47.2, mag: 8.4 },\n      { id: 'M27', nm: 'DUMBBELL NEBULA', kind: 'PLANETARY NEBULA', con: 'VULPECULA', ra: 299.9, dec: 22.72, mag: 7.5 },\n      { id: 'M8', nm: 'LAGOON NEBULA', kind: 'EMISSION NEBULA', con: 'SAGITTARIUS', ra: 270.92, dec: -24.38, mag: 6.0 },\n      { id: 'M104', nm: 'SOMBRERO GALAXY', kind: 'SPIRAL GALAXY', con: 'VIRGO', ra: 189.99, dec: -11.62, mag: 8.0 }\n    ];\n    let dso = null, dsoAA = null;\n    if (S.altAz && S.jdOf) {\n      const jd = S.jdOf(new Date());\n      let bestScore = -999;\n      for (const d of DSOS) {\n        const aa = S.altAz(d.ra, d.dec, jd);\n        const score = aa.alt - d.mag * 2;\n        if (aa.alt > 15 && score > bestScore) { bestScore = score; dso = d; dsoAA = aa; }\n      }\n    }\n    const dsoName = dso ? `${dso.id} · ${dso.nm}` : 'NONE WELL-PLACED';\n    const dsoKind = dso ? dso.kind : 'CHECK BACK AFTER DARK';\n    const dsoCon = dso ? dso.con : '';\n    const dsoPoint = dso && dsoAA\n      ? `LOOK ${S.cardinal ? S.cardinal(dsoAA.az) : ''} (${Math.round(dsoAA.az)}°) · ${Math.round(dsoAA.alt)}° UP`\n      : 'ALL CATALOG TARGETS BELOW 15° ELEVATION';\n    const dsoVis = dso ? (dso.mag <= 4.3 ? 'EYE' : 'BINOC') : '--';\n    const dsoVisColor = dso ? (dso.mag <= 4.3 ? '#4dffb8' : '#8fb2d4') : '#5d7a96';\n\n    // ISS pass line for ticker\n    const np = I.nextPass;\n\n    // status ticker\n    const alerts = [];\n    if (I.up) alerts.push('ISS OVERHEAD NOW — LOOK UP');\n    else if (np) alerts.push(`ISS PASS ${np.at} (T-${np.inMin}M) · MAX EL ${np.maxEl}° ${np.dir}${np.dark ? ' · VISIBLE' : ''}`);\n    alerts.push(`KP ${kp.toFixed(1)} ${kpWord}`);\n    if (best) alerts.push(`${best.n.toUpperCase()} ${best.daysToPeak === 0 ? 'PEAKS TONIGHT' : best.daysToPeak > 0 ? `PEAK IN ${best.daysToPeak}D` : 'ACTIVE'} · ZHR ${best.zhr}`);\n    if (L.phase === 'ASCENT') alerts.push(`${L.vehicle || 'SPACEX'} ${L.mission || ''} ASCENT IN PROGRESS`);\n    else if (L.phase === 'UPCOMING') alerts.push(`${L.vehicle || 'SPACEX'} ${L.mission || ''} GO FOR LAUNCH`);\n    if (dso) alerts.push(`DEEP-SKY PICK: ${dso.id} ${dso.nm}`);\n    if (P.name) alerts.push(`MOON ${pct}% · ${P.name}`);\n    alerts.push(`${T.visCount || 0} OBJECTS ABOVE HORIZON`);\n    const tickerText = alerts.join('   ◆   ');\n\n    const leftPos = this.positionsFor(this.state.leftOrder);\n    const rightPos = this.positionsFor(this.state.rightOrder);\n    const leftHandlers = this.panelHandlers('left');\n    const rightHandlers = this.panelHandlers('right');\n    const leftOpacity = this.state.leftOrder.map((_, i) => (this.state.dragCol === 'left' && this.state.dragFrom === i) ? 0.35 : 1);\n    const rightOpacity = this.state.rig
